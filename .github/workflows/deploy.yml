name: Deploy to Vultr

permissions:
  contents: write     # ← allows git push

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 ─ checkout just for metadata (optional)
      - uses: actions/checkout@v3
      - name: Bump version
        run: |
          ver=$(cat version.txt)
          major=${ver%%.*}
          rest=${ver#*.}
          minor=${rest%%.*}
          patch=${rest##*.}
          new_patch=$((patch + 1))
          echo "$major.$minor.$new_patch" > version.txt
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -am "chore: bump version to $major.$minor.$new_patch"
          git push
      # 2 ─ install key + known_hosts
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VULTR_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 66.135.13.130 >> ~/.ssh/known_hosts

      # 3 ─ deploy
      - name: Deploy to VPS
        env:
          REPO_SSH: git@github.com:scottjamescop/Strongbot.git
        run: |
          ssh -i ~/.ssh/id_rsa root@66.135.13.130 bash -s -- "$REPO_SSH" <<'EOF'
            set -e
            REPO_SSH="$1"
      
            cd /root/discord-bot
      
            # Initialise if .git missing
            if [ ! -d .git ]; then
              echo "⚙️  Initialising git repo"
              git init
            fi
      
            # Ensure 'origin' remote exists (add or update URL)
            if git remote | grep -q '^origin$'; then
              git remote set-url origin "$REPO_SSH"
            else
              git remote add origin "$REPO_SSH"
            fi
      
            echo "🔄  Updating code"
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
      
            systemctl daemon-reload
            systemctl restart discordbot
          EOF
