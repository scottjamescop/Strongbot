name: Deploy to Vultr

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 ─ checkout just for metadata (optional)
      - uses: actions/checkout@v3

      # 2 ─ install key + known_hosts
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VULTR_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 66.135.13.130 >> ~/.ssh/known_hosts

      # 3 ─ deploy
      - name: Deploy to VPS
        env:
          REPO_SSH: git@github.com:scottjamescop/Strongbot.git   # ← edit
        run: |
          ssh -i ~/.ssh/id_rsa root@66.135.13.130 bash -s <<EOF
            set -e
            cd /root/discord-bot

            if [ ! -d .git ]; then
              echo "⚙️  Initialising git repo"
              git init
              git remote add origin "$REPO_SSH"
            fi

            echo "🔄  Updating code"
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD

            systemctl daemon-reload
            systemctl restart discordbot
          EOF
