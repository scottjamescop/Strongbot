name: Deploy to Vultr

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (runner only, for metadata)
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VULTR_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 66.135.13.130 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          REPO_SSH: git@github.com:scottjamescop/Strongbot.git
        run: |
          ssh -i ~/.ssh/id_rsa root@66.135.13.130 << 'EOF'
            set -e

            cd /root/discord-bot

            if [ ! -d .git ]; then
              echo "⚙️  Initialising git repo in existing folder"
              git init
              git remote add origin $REPO_SSH
            fi

            echo "🔄  Fetching latest main"
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD

            systemctl daemon-reload
            systemctl restart discordbot
          EOF
